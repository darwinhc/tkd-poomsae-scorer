<section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-panel">
  <h3 class="mb-3 flex items-center gap-2 text-lg font-bold text-slate-900">
    <i data-lucide="refresh-ccw-dot" class="h-5 w-5 text-brand-700"></i>{{ t('live_panel.heading') }}
  </h3>
  <div class="grid gap-4 lg:grid-cols-[220px,1fr]">
    <img alt="{{ t('live_panel.qr_alt') }}" src="data:image/png;base64,{{ station_qr_base64 }}" class="qr-pulse h-[210px] w-[210px] rounded-xl border border-slate-200 bg-white p-2">
    <div class="min-w-0 space-y-3">
      <label class="block text-sm font-semibold text-slate-700">{{ t('live_panel.credential_label') }}</label>
      <div class="flex items-center gap-2">
        <input
          type="text"
          value="{{ t('live_panel.credential_unreadable') if live.credential_unreadable else live.credential_revealed if reveal and live.credential_revealed else live.credential_masked }}"
          disabled
          class="w-full rounded-lg border border-blue-300 bg-blue-50 px-3 py-2 font-mono text-base font-bold tracking-[0.15em] text-blue-900"
        >
        <a
          href="/admin/stations/{{ live.station_id }}?reveal={{ 0 if reveal else 1 }}"
          class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-brand-600 text-white hover:bg-brand-700"
          title="{{ t('live_panel.hide_credential') if reveal else t('live_panel.show_credential') }}"
        >
          <i data-lucide="{{ 'eye-off' if reveal else 'eye' }}" class="h-5 w-5"></i>
        </a>
      </div>
      <p class="text-sm text-slate-600"><span class="font-semibold">{{ t('live_panel.expires') }}:</span> {{ live.credential_expires_at or t('live_panel.not_set') }}</p>
      <div class="flex flex-wrap items-center gap-3">
        <form method="post" action="/admin/stations/{{ live.station_id }}/rotate-credential">
          <input type="hidden" name="actor" value="local-admin">
          <button class="inline-flex items-center gap-1 rounded-lg bg-amber-500 px-3 py-1.5 text-sm font-semibold text-slate-900 hover:bg-amber-400" type="submit">
            <i data-lucide="refresh-cw" class="h-4 w-4"></i>{{ t('live_panel.rotate_credential') }}
          </button>
        </form>
        <p class="text-sm text-slate-500">{{ t('live_panel.auto_rotate_hint', seconds=live_refresh_seconds or 20) }}</p>
      </div>
      <details class="max-w-full rounded-xl border border-slate-200 bg-slate-50 p-3">
        <summary class="cursor-pointer text-sm font-semibold text-slate-700">{{ t('live_panel.bootstrap_payload') }}</summary>
        <div class="mt-2 flex justify-end">
          <button
            type="button"
            class="inline-flex items-center gap-1 rounded-lg bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-slate-700"
            onclick='window.tkdCopyText({{ live.bootstrap_payload_json|tojson }}, this)'
            title="{{ t('live_panel.copy_json') }}"
          >
            <i data-lucide="copy" class="h-4 w-4"></i>{{ t('common.copy') }}
          </button>
        </div>
        <pre class="mt-2 max-h-72 max-w-full overflow-auto whitespace-pre-wrap break-all rounded-lg bg-slate-900 p-3 text-xs text-slate-100">{{ live.bootstrap_payload_json }}</pre>
      </details>
    </div>
  </div>
</section>
