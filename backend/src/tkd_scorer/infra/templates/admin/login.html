{% extends "admin/base.html" %}
{% block title %}{{ t('login.page_title') }}{% endblock %}
{% block content %}
<section class="mx-auto mt-8 max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-panel">
  <div class="mb-5 flex items-center gap-3">
    <div class="rounded-xl bg-brand-100 p-2 text-brand-700">
      <i data-lucide="lock-keyhole" class="h-5 w-5"></i>
    </div>
    <div>
      <h2 class="text-xl font-extrabold text-slate-900">{{ t('login.heading') }}</h2>
      <p class="text-sm text-slate-600">{{ t('login.subtitle') }}</p>
    </div>
  </div>

  {% if error %}
  <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="{{ admin_base_path }}/login" class="space-y-4">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label class="block text-sm font-semibold text-slate-700">
      {{ t('login.password') }}
      <input
        type="password"
        name="password"
        required
        autofocus
        class="mt-1 w-full rounded-lg border-slate-300 focus:border-brand-500 focus:ring-brand-500"
      >
    </label>
    <button
      type="submit"
      class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-extrabold text-white hover:bg-brand-700"
    >
      <i data-lucide="log-in" class="h-4 w-4"></i>{{ t('login.submit') }}
    </button>
  </form>
</section>
{% endblock %}
