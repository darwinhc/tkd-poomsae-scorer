[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tkd-poomsae-scorer-backend"
version = "0.1.0"
description = "Hexagonal backend for taekwondo poomsae scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "jinja2>=3.1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  # Station PIN encryption (Fernet); also pulled in by python-jose[cryptography].
  "cryptography>=42.0.0",
  "passlib[bcrypt]>=1.7.4",
  "pyyaml>=6.0.1",
  "qrcode[pil]>=8.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]
packaging = [
  "pyinstaller>=6.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tkd_scorer = [
  "infra/templates/**/*.html",
  "infra/static/**/*",
  "infra/i18n/locales/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]
